[tools]
actionlint = "1.7.12"
"aqua:anthropics/claude-code" = "2.1.332"
shellcheck = "0.11.0"

[tasks.check]
shell = "bash -euo pipefail -c"
run = [
  "for folder in . plugins/*; do claude plugin validate \"$folder\" --strict; done",
  "shellcheck --severity=warning install.sh plugins/*/hooks/*.sh plugins/*/skills/*/scripts/*.sh",
  "actionlint",
]
